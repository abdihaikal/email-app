name: 'email-app-by-abdihaikal'

services:

  backend:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "${PORT}:3000"
    networks:
      - email-app-net
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    profiles: [backend]

  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - email-app-net
    restart: unless-stopped
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready",
        "-U", "${POSTGRES_USER}",
        "-d", "${POSTGRES_DB}"
      ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  redis:
    image: redis:7-alpine
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - email-app-net
    restart: unless-stopped
    healthcheck:
      test: [
        "CMD-SHELL",
        "redis-cli",
        "--raw",
        "incr",
        "ping"
      ]
      interval: 1s
      timeout: 3s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    env_file: .env
    environment:
      NODE_ENV: production
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
    volumes:
      - redisinsight-data:/data
    ports:
      - "5540:5540"
    networks:
      - email-app-net
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    profiles: [redisinsight]

volumes:
  postgres-data:
  redis-data:
  redisinsight-data:

networks:
  email-app-net:
